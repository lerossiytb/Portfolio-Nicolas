<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seite nicht gefunden | LeRossi</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#FF2A1A">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400..800&family=Instrument+Serif:ital@1&display=swap">
    <link rel="stylesheet" href="/style.css">
    <style>
        .nf { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; justify-content: center; padding: 6rem var(--pad); }
        .nf h1 { font-size: clamp(6rem, 26vw, 24rem); letter-spacing: -0.08em; line-height: .8; }
        .nf h1 .mix-dot { width: .2em; height: .2em; }
        .nf p { font-size: clamp(1.3rem, 2.4vw, 2rem); font-weight: 600; letter-spacing: -0.03em; margin: 2rem 0 2.5rem; max-width: 30ch; }
        .nf p em { color: var(--dot); }
    </style>
</head>
<body data-theme="red">
    <main class="nf">
        <a href="/" class="logo" style="position:absolute;top:1.5rem;left:var(--pad)">LeRossi<span class="mix-dot static"></span></a>
        <h1>404<span class="mix-dot"></span></h1>
        <p>Diese Seite gibt es nicht – aber den Rest kannst du trotzdem <em>liken</em>.</p>
        <div class="btn-row">
            <a href="/" class="btn">Zur Startseite <span class="arrow" aria-hidden="true">→</span></a>
            <a href="/#contact" class="btn btn-ghost">Kontakt</a>
        </div>
    </main>
</body>
</html>
