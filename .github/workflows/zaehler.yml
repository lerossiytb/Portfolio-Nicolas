name: Aufrufzähler sichern

# Holt die Zählerstände (nur lesen, /get) und führt das Besuchsprotokoll.
# Ergebnis: aufrufe.json (Totale) und besuche.json (Besuche mit Uhrzeit)
# auf dem Branch "zaehler". Die Website (main) bleibt unberührt.
# Wird vom geplanten Claude-Task direkt gestartet, der Zeitplan ist Reserve.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: zaehler

jobs:
  sichern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Branch "zaehler" holen
        run: |
          git init -q daten && cd daten
          git config user.name "zaehler-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin zaehler 2>/dev/null; then
            git checkout -q -b zaehler FETCH_HEAD
          else
            git checkout -q --orphan zaehler
          fi

      - name: Zähler abrufen und Besuche zuordnen
        run: python3 .github/scripts/zaehler.py daten

      - name: Speichern
        run: |
          cd daten
          git add aufrufe.json besuche.json
          git diff --cached --quiet && { echo "unverändert"; exit 0; }
          git commit -q -m "Zählerstände $(TZ=Europe/Zurich date '+%d.%m. %H:%M')"
          git push -q origin zaehler
